x<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Language Quest"><title>Language Quest</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#68738a;--a:#6c63ff;--gold:#ffb703;--green:#20a464}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:900}.muted{color:var(--muted);font-size:13px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 5px 22px #17203312;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.hero{background:linear-gradient(135deg,#6c63ff,#8b84ff);color:#fff}.hero .muted{color:#eee}.avatar{font-size:48px}.name{font-size:22px;font-weight:800}.stats{display:flex;gap:16px;margin:10px 0}.stat b{display:block;font-size:19px}.bar{height:9px;background:#e7e9f1;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--gold)}button{border:0;border-radius:13px;padding:11px 15px;background:var(--a);color:#fff;font-weight:800}button.secondary{background:#e9ecf5;color:var(--ink)}button:disabled{opacity:.5}.tabs{display:flex;gap:8px;margin:15px 0;overflow:auto}.tabs button{white-space:nowrap}.quest{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #edf0f5}.quest:last-child{border:0}.quest .grow{flex:1}.check{width:28px;height:28px;border-radius:9px;background:#edf0f5;display:grid;place-items:center}.done .check{background:var(--green);color:#fff}.done .grow{text-decoration:line-through;color:#8992a5}.xp{color:var(--a);font-weight:900}.leader{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f5}.leader .grow{flex:1}.rank{font-size:23px;width:28px}.pill{padding:5px 9px;border-radius:99px;background:#f0efff;color:#5148dc;font-weight:800;font-size:12px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:100%;max-width:430px;background:#fff;border-radius:22px;padding:22px}.modalbox input{width:100%;padding:13px;border:1px solid #dce1eb;border-radius:12px;margin:6px 0 13px;font-size:16px}.error{color:#c62828;font-weight:700}.success{color:#17824d;font-weight:700}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 18px;border-radius:99px;display:none;font-weight:800}
@media(max-width:650px){.grid{grid-template-columns:1fr}.logo{font-size:26px}}
</style></head><body><div class="app">
<div class="top"><div><div class="logo">🌎 Language Quest</div><div class="muted">Your Rosetta Stone game</div></div><button class="secondary" onclick="openParent()">👩‍💻 Parent</button></div>
<div class="tabs"><button onclick="tab('home')">🎯 Quests</button><button class="secondary" onclick="tab('board')">🏆 Leaderboard</button><button class="secondary" onclick="tab('rewards')">🎁 Rewards</button></div>
<div id="home"></div><div id="board" style="display:none"></div><div id="rewards" style="display:none"></div></div>
<div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const KEY="LQv2";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{parentPin:"2468",language:"Spanish",kids:[
{name:"Kid 1",avatar:"🦊",xp:0,coins:0,streak:0},
{name:"Kid 2",avatar:"🐼",xp:0,coins:0,streak:0}],rewards:[
["🍨","Choose dessert",30],["📺","Choose family movie",50],["🎮","20 extra minutes of screen time",75],["🍕","Choose Friday dinner",100],["🌟","Pick weekend activity",150],["💵","$5 reward",300]]};
const quests=[["Complete a Rosetta Stone activity",25],["Finish your assigned lesson",25],["Score 80% or higher",10],["Complete without stopping",5]];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function lvl(x){return Math.floor(x/100)+1}
function render(){home.innerHTML=`<div class="grid">${db.kids.map((p,i)=>card(p,i)).join("")}</div><div class="card"><h2>🔥 Today's Quests</h2>${quests.map((q,i)=>`<div class="quest"><div class="check">🎯</div><div class="grow"><b>${q[0]}</b><br><span class="muted">Tap complete after doing it in Rosetta Stone.</span></div><span class="xp">+${q[1]} XP</span><button onclick="complete(${i})">Done</button></div>`).join("")}</div><div class="card"><h2>⚔️ Weekly Boss Battle</h2><div class="muted">Say as many words or phrases as possible in 60 seconds.</div><br><button onclick="boss()">Defeat Boss +50 XP</button></div>`}
function selectKid(i){db.activeKid=i;save();toast(`👋 ${db.kids[i].name} selected!`);render();}
function card(p,i){let pct=p.xp%100;return `<div class="card hero" onclick="selectKid(${i})" style="cursor:pointer"> <div class="avatar">${p.avatar}</div><div class="name">${esc(p.name)}</div><div class="muted">Level ${lvl(p.xp)} · ${esc(db.language)}</div><div class="stats"><div class="stat"><b>⭐ ${p.xp}</b><span class="muted">XP</span></div><div class="stat"><b>🔥 ${p.streak}</b><span class="muted">streak</span></div><div class="stat"><b>🪙 ${p.coins}</b><span class="muted">coins</span></div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>`}
function chooseKid(){let s=prompt(`Who completed it? Enter 1 for ${db.kids[0].name} or 2 for ${db.kids[1].name}.`);return s==="2"?1:0}
function complete(i){let k=chooseKid(),p=db.kids[k];p.xp+=quests[i][1];p.coins+=Math.max(1,Math.floor(quests[i][1]/10));p.streak=Math.max(1,p.streak);save();toast(`🎉 +${quests[i][1]} XP for ${p.name}!`);render()}
function boss(){let k=chooseKid(),p=db.kids[k];p.xp+=50;p.coins+=5;p.streak++;save();toast("⚔️ Boss defeated! +50 XP");render()}
function tab(t){home.style.display=t==="home"?"block":"none";board.style.display=t==="board"?"block":"none";rewards.style.display=t==="rewards"?"block":"none";if(t==="board")renderBoard();if(t==="rewards")renderRewards()}
function renderBoard(){let a=[...db.kids].sort((x,y)=>y.xp-x.xp);board.innerHTML=`<div class="card"><h2>🏆 Family Leaderboard</h2>${a.map((p,i)=>`<div class="leader"><div class="rank">${["🥇","🥈"][i]}</div><div class="grow"><b>${esc(p.name)}</b><br><span class="muted">Level ${lvl(p.xp)} · 🔥 ${p.streak}</span></div><span class="pill">${p.xp} XP</span></div>`).join("")}</div>`}
function renderRewards(){rewards.innerHTML=`<div class="card"><h2>🎁 Reward Shop</h2><div class="muted">Kids spend coins they earned by doing Rosetta Stone work.</div>${db.rewards.map((r,i)=>`<div class="quest"><div style="font-size:28px">${r[0]}</div><div class="grow"><b>${r[1]}</b><br><span class="muted">${r[2]} coins</span></div><button onclick="redeem(${i})">Redeem</button></div>`).join("")}</div>`}
function redeem(i){let k=chooseKid(),p=db.kids[k],r=db.rewards[i];if(p.coins<r[2])return toast(`${p.name} needs ${r[2]-p.coins} more coins.`);p.coins-=r[2];save();toast(`🎁 ${p.name} redeemed ${r[1]}!`);render();renderRewards()}
function openParent(){modalbox.innerHTML=`<h2>👩‍💻 Parent Dashboard</h2><div class="muted">Enter your parent PIN.</div><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button onclick="login()">Log in</button><button class="secondary" onclick="closeM()">Cancel</button>`;modal.classList.add("show")}
function login(){if(pin.value!==db.parentPin){modalbox.innerHTML+=`<p class="error">Incorrect PIN.</p>`;return}showParent()}
function showParent(){modalbox.innerHTML=`<h2>👩‍💻 Parent Dashboard</h2><label>Language</label><input id="lang" value="${esc(db.language)}"><h3>Kids</h3>${db.kids.map((p,i)=>`<label>Kid ${i+1} name</label><input id="kn${i}" value="${esc(p.name)}"><label>Avatar</label><input id="ka${i}" value="${esc(p.avatar)}">`).join("")}<label>Parent PIN</label><input id="newpin" inputmode="numeric" value="${esc(db.parentPin)}"><button onclick="saveParent()">Save changes</button><button class="secondary" onclick="closeM()">Close</button><hr><button class="secondary" onclick="resetAll()">Reset all game data</button>`}
function saveParent(){db.language=lang.value||"Spanish";db.kids.forEach((p,i)=>{p.name=document.getElementById("kn"+i).value||`Kid ${i+1}`;p.avatar=document.getElementById("ka"+i).value||"⭐"});db.parentPin=newpin.value||"2468";save();closeM();render();toast("Parent settings saved")}
function resetAll(){if(confirm("Reset XP, coins and streaks?")){db.kids.forEach(p=>{p.xp=0;p.coins=0;p.streak=0});save();closeM();render()}}
function closeM(){modal.classList.remove("show")}
function toast(t){toastEl=document.getElementById("toast");toastEl.textContent=t;toastEl.style.display="block";setTimeout(()=>toastEl.style.display="none",1800)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();render();function selectKid(i){db.activeKid=i;save();render();}
</script></body></html>
